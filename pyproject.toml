[project]
name = "asc2mb"
version = "0.8.0"
description = "Parse the XML export from aSc Timetables and format it into files suitable for upload into ManageBac"
authors = [{ name = "Adam Morris", email = "adam.morris@fariaedu.com" }]
license = { text = "MIT" }
readme = "README.md"
keywords = ["ManageBac", "aSc", "timetable"]
requires-python = ">=3.8,<4.0"
dependencies = [
    "click==8.0",
    "lxml>=4.9.1,<5",
    "rich-click>=1.6.1,<2",
    "rich>=13.3.5,<14",
]

[project.scripts]
asc2mb = "asc2mb.cli:main"

[dependency-groups]
dev = ["pytest>=7.0,<8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["asc2mb"]
